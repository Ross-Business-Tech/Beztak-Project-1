<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Manual Gap Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231473e6'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">

<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="Main">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span class="brand-t"><b>Manual Gap Tracker</b></span></div>
    <nav class="nav" id="nav" aria-label="Views"></nav>
    <div class="side-f" id="side-f"></div>
  </aside>

  <header class="topbar" id="topbar"></header>

  <main class="content" id="main">
    <div id="embed-bar" class="embed-bar" hidden></div>
    <div id="banner" class="banners"></div>
    <div id="view" tabindex="-1"></div>
  </main>

  <aside class="panel" id="panel" hidden aria-label="Gap details"></aside>
</div>

<dialog class="sheet" id="settings" aria-labelledby="settings-h"></dialog>
<input type="file" id="file" class="sr" accept=".csv,.json,text/csv,application/json" aria-label="Choose a questions file" tabindex="-1">
<input type="file" id="restore" class="sr" accept=".json,application/json" aria-label="Choose a backup file" tabindex="-1">
<noscript><p style="padding:2rem">This tool needs JavaScript turned on.</p></noscript>

<script src="js/hr-config.js"></script>

<script src="js/render-pptx.js"></script>

<script src="js/common.js"></script>
<script src="js/email.js"></script>
<script src="js/services.js"></script>
<script src="js/ui/shared.js"></script>
<script src="js/ui/overview.js"></script>
